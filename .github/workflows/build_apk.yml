name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 1. Generate Base Android Files First
        run: |
          rm -rf android
          flutter create . --project-name my_ebook_reader --org com.example
          sed -i "s/compileSdk = .*/compileSdk = 36/g" android/app/build.gradle.kts
          sed -i "s/minSdk = .*/minSdk = 24/g" android/app/build.gradle.kts

      - name: 2. Unzip Ebook Reader Code Over Default Template
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: 저장소에 업로드된 .zip 파일이 없습니다! flutter_ebook_reader_v5_japanese_edition.zip 파일을 업로드해주세요."
            exit 1
          fi
          for z in "${zips[@]}"; do
            echo "Unzipping $z and overwriting default template..."
            unzip -o "$z" -d .
          done
          mkdir -p android/app/src/main/kotlin/com/example/my_ebook_reader
          cp -f android_override/MainActivity.kt android/app/src/main/kotlin/com/example/my_ebook_reader/MainActivity.kt

      - name: 3. Install Dependencies and Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 4. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ebook-reader-v2-all-in-one-apk
          path: build/app/outputs/flutter-apk/app-release.apk
