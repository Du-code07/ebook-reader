name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Generate Android Platform Files & Patch SDK Versions (compileSdk 36 / minSdk 24)
        run: |
          if [ ! -f "lib/screens/pdf_and_image_viewer.dart" ]; then
            FOUND_PUBSPEC=$(find . -maxdepth 3 -name "pubspec.yaml" | grep -v "^\./pubspec\.yaml$" | head -n 1)
            if [ -n "$FOUND_PUBSPEC" ]; then
              SUBDIR=$(dirname "$FOUND_PUBSPEC")
              echo "Found project inside subdirectory: $SUBDIR. Moving to root..."
              cp -rf "$SUBDIR"/* .
            fi
          fi

          if ! grep -q "BookshelfScreen" lib/main.dart; then
            echo "ERROR: lib/main.dart에 BookshelfScreen이 없습니다! GitHub 저장소에 lib/ 폴더가 제대로 올라갔는지 확인해주세요."
            exit 1
          fi

          # Dart 3.x / Flutter 3.47+ 에서 숫자 타입(num/int/double) 오류 자동 보정
          if [ -f "lib/screens/pdf_and_image_viewer.dart" ]; then
            sed -i 's/left: boxLeft,/left: boxLeft.toDouble(),/g' lib/screens/pdf_and_image_viewer.dart
            sed -i 's/math.max<int>(1, b.translatedText.length \* 1.8)/math.max<double>(1.0, b.translatedText.length * 1.8)/g' lib/screens/pdf_and_image_viewer.dart
            sed -i 's/top: boxTop,/top: boxTop.toDouble(),/g' lib/screens/pdf_and_image_viewer.dart
            sed -i 's/width: boxW,/width: boxW.toDouble(),/g' lib/screens/pdf_and_image_viewer.dart
            sed -i 's/height: boxH,/height: boxH.toDouble(),/g' lib/screens/pdf_and_image_viewer.dart
            sed -i 's/bottom: math.max(bottomInset + 4, 8),/bottom: math.max<double>(bottomInset + 4.0, 8.0),/g' lib/screens/pdf_and_image_viewer.dart
            sed -i 's/bottom: math.max(bottomInset + 26, 28),/bottom: math.max<double>(bottomInset + 26.0, 28.0),/g' lib/screens/pdf_and_image_viewer.dart
          fi

          mkdir -p /tmp/v7_backup
          cp -rf lib /tmp/v7_backup/
          cp -f pubspec.yaml /tmp/v7_backup/
          cp -rf android_override /tmp/v7_backup/

          flutter create . --project-name my_ebook_reader --org com.example

          rm -rf lib test
          cp -rf /tmp/v7_backup/lib .
          cp -f /tmp/v7_backup/pubspec.yaml .

          mkdir -p android/app/src/main/kotlin/com/example/my_ebook_reader
          cp -f /tmp/v7_backup/android_override/MainActivity.kt android/app/src/main/kotlin/com/example/my_ebook_reader/MainActivity.kt
          rm -f android/app/src/main/java/com/example/my_ebook_reader/MainActivity.java

          echo "-keep class com.google.mlkit.** { *; }" > android/app/proguard-rules.pro
          echo "-dontwarn com.google.mlkit.**" >> android/app/proguard-rules.pro

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 24/g' android/app/build.gradle
            echo "" >> android/app/build.gradle
            echo "android { buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } } }" >> android/app/build.gradle
            echo "dependencies {" >> android/app/build.gradle
            echo "    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'" >> android/app/build.gradle
            echo "    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'" >> android/app/build.gradle
            echo "    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'" >> android/app/build.gradle
            echo "    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'" >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
            echo "" >> android/app/build.gradle.kts
            echo 'android { buildTypes { getByName("release") { isMinifyEnabled = false; isShrinkResources = false; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro") } } }' >> android/app/build.gradle.kts
            echo "dependencies {" >> android/app/build.gradle.kts
            echo '    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")' >> android/app/build.gradle.kts
            echo '    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")' >> android/app/build.gradle.kts
            echo '    implementation("com.google.mlkit:text-recognition-korean:16.0.1")' >> android/app/build.gradle.kts
            echo '    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")' >> android/app/build.gradle.kts
            echo "}" >> android/app/build.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            sed -i '/evaluationDependsOn/d' android/build.gradle
            echo "" >> android/build.gradle
            echo "subprojects {" >> android/build.gradle
            echo "    afterEvaluate { project ->" >> android/build.gradle
            echo '        if (project.hasProperty("android")) {' >> android/build.gradle
            echo "            project.android { compileSdkVersion 36 }" >> android/build.gradle
            echo "        }" >> android/build.gradle
            echo "    }" >> android/build.gradle
            echo "}" >> android/build.gradle
            echo 'subprojects { project.evaluationDependsOn(":app") }' >> android/build.gradle
          fi

          if [ -f android/build.gradle.kts ]; then
            sed -i '/evaluationDependsOn/d' android/build.gradle.kts
            echo "" >> android/build.gradle.kts
            echo "subprojects {" >> android/build.gradle.kts
            echo "    afterEvaluate {" >> android/build.gradle.kts
            echo '        if (extensions.findByName("android") != null) {' >> android/build.gradle.kts
            echo '            extensions.configure<com.android.build.gradle.BaseExtension>("android") {' >> android/build.gradle.kts
            echo "                compileSdkVersion(36)" >> android/build.gradle.kts
            echo "            }" >> android/build.gradle.kts
            echo "        }" >> android/build.gradle.kts
            echo "    }" >> android/build.gradle.kts
            echo "}" >> android/build.gradle.kts
            echo 'subprojects { project.evaluationDependsOn(":app") }' >> android/build.gradle.kts
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/> <application/' "$MANIFEST"
            fi
            sed -i 's/android:label="[^"]*"/android:label="FReader"/' "$MANIFEST"
          fi

      - name: 5. Install Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ebook-reader-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
