name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release & Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Scaffold & Configure Android Platform
        run: |
          # android 폴더가 없는 경우 Flutter Android 플랫폼 자동 생성
          if [ ! -d "android" ]; then
            echo "Generating Android platform files..."
            flutter create --platforms=android --org com.example --project-name my_ebook_reader .
          fi

          # 커스텀 MainActivity.kt (볼륨키 페이지 넘김 & 내장 PDF 렌더러) 덮어쓰기
          MAIN_KT_DIR="android/app/src/main/kotlin/com/example/my_ebook_reader"
          mkdir -p "$MAIN_KT_DIR"
          if [ -f "android_override/MainActivity.kt" ]; then
            cp -f android_override/MainActivity.kt "$MAIN_KT_DIR/MainActivity.kt"
            echo "Copied custom MainActivity.kt to $MAIN_KT_DIR/MainActivity.kt"
          fi

          # Java 17로 기본 생성된 MainActivity.java가 있다면 충돌 방지를 위해 제거
          rm -f android/app/src/main/java/com/example/my_ebook_reader/MainActivity.java

          # AndroidManifest.xml에 인터넷 권한 및 cleartext 트래픽 허용 확인/추가
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>/' "$MANIFEST"
            fi
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
          fi

          # ML Kit 일본어/중국어 OCR 모델 및 minSdkVersion 21+, R8/Proguard 충돌 방지 설정
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

          # Gradle 메모리 및 빌드 안정성 설정 보강
          if [ -f "android/gradle.properties" ]; then
            if ! grep -q "org.gradle.jvmargs" "android/gradle.properties"; then
              echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
            fi
          fi

          # build.gradle 또는 build.gradle.kts에 ML Kit 일본어/중국어 인식기 의존성 및 minSdk 21 보장
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle
            if ! grep -q "text-recognition-japanese" android/app/build.gradle; then
              cat << 'EOF' >> android/app/build.gradle

          android {
              defaultConfig {
                  minSdkVersion 23
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
              implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
          }
          EOF
            fi
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle.kts
            if ! grep -q "text-recognition-japanese" android/app/build.gradle.kts; then
              cat << 'EOF' >> android/app/build.gradle.kts

          android {
              defaultConfig {
                  minSdk = 23
                  multiDexEnabled = true
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          dependencies {
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
          }
          EOF
            fi
          fi

      - name: 5. Install Flutter Dependencies
        run: flutter pub get

      - name: 6. Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Build Split-per-ABI APKs (Lightweight ARM64)
        run: flutter build apk --split-per-abi --release --no-tree-shake-icons

      - name: 8. Prepare Renamed APK Files
        run: |
          mkdir -p dist_apks
          cp build/app/outputs/flutter-apk/app-release.apk dist_apks/my_ebook_reader_universal_release.apk
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist_apks/my_ebook_reader_arm64_v8a.apk
          fi

      - name: 9. Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-ebook-reader-apks
          path: dist_apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 10. Publish APK to GitHub Releases (Optional on Push/Manual Run)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-build.${{ github.run_number }}
          name: "eBook Reader APK Build #${{ github.run_number }}"
          body: |
            자동 빌드된 안드로이드 e북 리더기 APK 파일입니다.
            - `my_ebook_reader_arm64_v8a.apk`: 최신 안드로이드 스마트폰용 경량 설치 파일 (권장)
            - `my_ebook_reader_universal_release.apk`: 모든 기기 호환용 통합 설치 파일
          files: dist_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
