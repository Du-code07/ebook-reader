name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Generate Android Platform Files & Patch SDK Versions (compileSdk 36 / minSdk 24)
        run: |
          # GitHub에 하위 폴더로 올라가 있는 경우에도 자동 감지하여 루트로 복사
          if [ ! -f "lib/screens/pdf_and_image_viewer.dart" ]; then
            FOUND_PUBSPEC=$(find . -maxdepth 3 -name "pubspec.yaml" \vert{} grep -v "^\./pubspec\.yaml$" | head -n 1)
            if [ -n "\$FOUND_PUBSPEC" ]; then
              SUBDIR=$(dirname "$FOUND_PUBSPEC")
              echo "Found v6 project inside subdirectory: \$SUBDIR. Moving to root..."
              cp -rf "\$SUBDIR"/* .
            fi
          fi

          # 핵심 검증 및 백업: flutter create 실행 전에 실제 e북 리더기 코드(lib/ 및 pubspec.yaml)를 백업합니다.
          if ! grep -q "BookshelfScreen" lib/main.dart; then
            echo "ERROR: lib/main.dart에 BookshelfScreen이 없습니다! GitHub 저장소에 lib/ 폴더가 제대로 올라갔는지 확인해주세요."
            exit 1
          fi

          mkdir -p /tmp/v6_backup
          cp -rf lib /tmp/v6_backup/
          cp -f pubspec.yaml /tmp/v6_backup/
          cp -rf android_override /tmp/v6_backup/

          # Android 플랫폼 파일 생성
          flutter create . --project-name my_ebook_reader --org com.example

          # flutter create가 생성한 기본 카운터 앱을 지우고 백업해둔 v6 e북 리더기 코드로 100% 복원
          rm -rf lib test
          cp -rf /tmp/v6_backup/lib .
          cp -f /tmp/v6_backup/pubspec.yaml .

          # 커스텀 MainActivity.kt (볼륨키 페이지 넘김 + 내장 PDF 렌더러) 덮어쓰기
          mkdir -p android/app/src/main/kotlin/com/example/my_ebook_reader
          cp -f /tmp/v6_backup/android_override/MainActivity.kt android/app/src/main/kotlin/com/example/my_ebook_reader/MainActivity.kt
          rm -f android/app/src/main/java/com/example/my_ebook_reader/MainActivity.java

          # 1. Patch app-level build.gradle / build.gradle.kts to compileSdk 36 & minSdk 24
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 24/g' android/app/build.gradle

            if ! grep -q "text-recognition-japanese" android/app/build.gradle; then
              cat << 'GRAD' >> android/app/build.gradle

          dependencies {
              implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
              implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
          }
          GRAD
            fi
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts

            if ! grep -q "text-recognition-japanese" android/app/build.gradle.kts; then
              cat << 'GRADKTS' >> android/app/build.gradle.kts

          dependencies {
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
          }
          GRADKTS
            fi
          fi

          # 2. Force all plugin subprojects to compile against SDK 36 (evaluationDependsOn(":app") 순서 충돌 방지)
          if [ -f android/build.gradle ]; then
            sed -i '/evaluationDependsOn/d' android/build.gradle
            cat << 'SUBGRAD' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          SUBGRAD
          fi

          if [ -f android/build.gradle.kts ]; then
            sed -i '/evaluationDependsOn/d' android/build.gradle.kts
            cat << 'SUBKTS' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (extensions.findByName("android") != null) {
                      extensions.configure<com.android.build.gradle.BaseExtension>("android") {
                          compileSdkVersion(36)
                      }
