name: my_ebook_reader
description: Fast, lightweight Android eBook, PDF, Word, PowerPoint, Excel, HWP, TXT, and Comic Reader.
publish_to: 'none'
version: 3.18.68+207

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # EPUB 뷰어: 화면 크기·불러오기 문제를 고친 버전을 프로젝트 안에 포함 (vendor 폴더)
  flutter_epub_viewer:
    path: vendor/flutter_epub_viewer
  flutter_inappwebview: 6.2.0-beta.3
  file_picker: ^10.1.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  # TXT: 한국어 옛 인코딩(EUC-KR/CP949) 읽기, DOCX·EPUB 구조 읽기
  cp949_codec: 1.0.2
  xml: ^6.5.0

# jni 1.2.0·jni_flutter 1.1.0(2026-11-19 배포)은 클래스 찾는 방식이 바뀌어 path_provider_android 2.3.1과 함께 쓰면
# 'Didn't find class "Landroid/content/Context;"' 오류로 앱 저장소를 못 찾음 → 짝이 맞는 이전 버전으로 함께 고정
dependency_overrides:
  jni: 1.1.2
  jni_flutter: 1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # TXT / 한글(HWP·HWPX) / 워드(DOC·DOCX) 열람용 화면·엔진·글꼴 (기기 안에서만 처리)
  assets:
    - assets/txt/
    - assets/hwp/
    - assets/hwp/fonts/
    - assets/docx/
    - assets/docx/engine/
    - assets/docx/metafile/
    - assets/docx/fonts/
    - assets/docx/fonts/metric/
    - assets/docx/fonts/free/
    - assets/textures/
    - assets/splash/
    - assets/ppt/
    - assets/ppt/engine/
    - assets/ppt/legacy/
    - assets/xlsx/
    - assets/xlsx/engine/
    - assets/xlsx/legacy/
    - assets/licenses/
